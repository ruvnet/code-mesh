name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Notes that apply to every Rust job below:
# - code-mesh-core's `native` and `wasm` features are mutually exclusive, so jobs
#   use the default feature set (plus --no-default-features) instead of --all-features.
# - code-mesh-tui does not compile yet and nothing depends on it:
#   https://github.com/ruvnet/code-mesh/issues/28
# - The benches do not compile against the current core API, so jobs build
#   lib/bin/test/example targets rather than --all-targets:
#   https://github.com/ruvnet/code-mesh/issues/29

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: nightly
    env:
      # rust-toolchain.toml pins `stable`; without this the beta/nightly legs
      # would silently build with stable.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.os }}-${{ matrix.rust }}

    - name: Check formatting
      if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
      run: cargo fmt --all -- --check

    - name: Run clippy
      if: matrix.rust == 'stable'
      run: cargo clippy --workspace --exclude code-mesh-tui --lib --bins --tests --examples -- -D warnings

    - name: Run tests (native)
      run: cargo test --workspace --exclude code-mesh-tui

    - name: Run tests (no default features)
      run: cargo test --workspace --exclude code-mesh-tui --no-default-features

    - name: Test documentation
      if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
      run: cargo doc --workspace --exclude code-mesh-tui --no-deps

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Run cargo deny
      uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate coverage report
      run: cargo llvm-cov --workspace --exclude code-mesh-tui --lcov --output-path lcov.info

    # Uploading needs a CODECOV_TOKEN repository secret; without it (forks, or
    # before the owner adds it) the report is still generated and archived.
    - name: Upload coverage to Codecov
      if: env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@v5
      with:
        files: lcov.info
        token: ${{ env.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Archive coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: lcov.info

  build:
    name: Build Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: code-mesh-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: code-mesh-windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: code-mesh-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: code-mesh-macos-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.os }}-${{ matrix.target }}

    - name: Build CLI
      run: cargo build --release --bin code-mesh --target ${{ matrix.target }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        if-no-files-found: error
        path: |
          target/${{ matrix.target }}/release/code-mesh
          target/${{ matrix.target }}/release/code-mesh.exe

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack@0.14.0

    - name: Build WASM package
      run: wasm-pack build --target web --scope code-mesh crates/code-mesh-wasm

    - name: Run WASM tests
      run: wasm-pack test --node crates/code-mesh-wasm

    - name: Upload WASM artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-mesh-wasm
        path: crates/code-mesh-wasm/pkg/
