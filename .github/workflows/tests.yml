name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Notes that apply to every Rust job below:
# - code-mesh-core's `native` and `wasm` features are mutually exclusive, so jobs
#   use the default feature set instead of --all-features.
# - code-mesh-tui does not compile yet and nothing depends on it:
#   https://github.com/ruvnet/code-mesh/issues/28
# - The benches, and the tests under tests/<subdir>/, are stale or never wired
#   up as test targets: https://github.com/ruvnet/code-mesh/issues/29

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly]
        exclude:
          # Reduce CI load by excluding some combinations
          - os: windows-latest
            rust: beta
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: nightly
          - os: macos-latest
            rust: nightly
    env:
      # rust-toolchain.toml pins `stable`; without this the beta/nightly legs
      # would silently build with stable.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-

    - name: Check formatting
      run: cargo fmt --all -- --check
      if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'

    - name: Run Clippy
      run: cargo clippy --workspace --exclude code-mesh-tui --lib --bins --tests --examples -- -D warnings
      if: matrix.rust == 'stable'

    - name: Build
      run: cargo build --workspace --exclude code-mesh-tui --lib --bins --tests --examples

    - name: Run unit tests
      run: cargo test --workspace --exclude code-mesh-tui --lib

    - name: Run binary tests
      run: cargo test --workspace --exclude code-mesh-tui --bins

    - name: Run doc tests
      run: cargo test --workspace --exclude code-mesh-tui --doc

  test-wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack@0.14.0

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          crates/code-mesh-wasm/target/
        key: wasm-cargo-${{ hashFiles('crates/code-mesh-wasm/Cargo.lock') }}

    - name: Build WASM
      run: wasm-pack build --target web crates/code-mesh-wasm

    # The wasm tests do not call wasm_bindgen_test_configure!(run_in_browser),
    # so they run under Node; a headless-browser run would execute zero tests.
    - name: Run WASM tests in Node.js
      run: wasm-pack test --node crates/code-mesh-wasm

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install tarpaulin
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: coverage-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Generate coverage report
      run: |
        cargo tarpaulin --workspace --exclude code-mesh-tui --timeout 120 \
          --exclude-files "tests/*" "benches/*" "examples/*" \
          --out xml --output-dir coverage/

    # Uploading needs a CODECOV_TOKEN repository secret; without it (forks, or
    # before the owner adds it) the report is still generated and archived.
    - name: Upload coverage to Codecov
      if: env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@v5
      with:
        files: coverage/cobertura.xml
        token: ${{ env.CODECOV_TOKEN }}
        fail_ci_if_error: true

    - name: Archive coverage results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    # Quarantined: the criterion benches do not compile against the current
    # core API. Re-enable once https://github.com/ruvnet/code-mesh/issues/29 is fixed.
    if: ${{ false }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Run benchmarks
      run: cargo bench -p code-mesh-core

    - name: Archive benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: target/criterion/

  mutation-tests:
    name: Mutation Testing
    runs-on: ubuntu-latest
    # Mutating the whole workspace takes hours, so this runs only on demand.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 300
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-mutants
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-mutants

    - name: Run mutation tests
      run: cargo mutants --package code-mesh-core --package code-mesh-cli --timeout 60 --jobs 2

    - name: Archive mutation test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutation-test-results
        path: mutants.out/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: Run cargo deny
      uses: EmbarkStudios/cargo-deny-action@v2

  memory-tests:
    name: Memory Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: memory-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run memory tests
      run: |
        cargo test --workspace --exclude code-mesh-tui --lib --bins --no-run --message-format=json \
          | jq -r 'select(.profile.test == true and .executable != null) | .executable' > test-binaries.txt
        test -s test-binaries.txt
        while read -r test_binary; do
          echo "Running memory test on $test_binary"
          valgrind --tool=memcheck --leak-check=full --errors-for-leak-kinds=definite \
            --error-exitcode=1 "$test_binary" --test-threads=1 < /dev/null
        done < test-binaries.txt

  cross-compile:
    name: Cross Compilation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # x86_64-apple-darwin is not listed: cross has no macOS image, and the
        # macOS builds run natively in ci.yml's Build Artifacts job.
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    # Cross.toml installs the target's OpenSSL for reqwest's native-tls backend.
    - name: Cross compile
      run: cross build --target ${{ matrix.target }} --workspace --exclude code-mesh-tui

  test-report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [test, test-wasm, coverage]
    if: always()
    steps:
    - name: Generate test report
      run: |
        echo "# Test Results Summary" > test-report.md
        echo "" >> test-report.md
        echo "- Unit tests: ${{ needs.test.result }}" >> test-report.md
        echo "- WASM tests: ${{ needs.test-wasm.result }}" >> test-report.md
        echo "- Coverage: ${{ needs.coverage.result }}" >> test-report.md

    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: test-report.md
