# Configuration for cargo-deny (schema v2, cargo-deny >= 0.16)
[graph]
# `native` and `wasm` in code-mesh-core are mutually exclusive, so check the
# default feature set rather than --all-features.
all-features = false

[advisories]
# Vulnerabilities and unsound crates are always errors in schema v2.
# Unmaintained crates are reported only for our direct dependencies.
unmaintained = "workspace"
yanked = "warn"
ignore = [
    #"RUSTSEC-0000-0000",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    # Successor of Unicode-DFS-2016; used by the ICU4X crates (via url/idna) and unicode-ident.
    "Unicode-3.0",
    # Permissive (foldhash via hashbrown).
    "Zlib",
    # Public-domain dedication (notify).
    "CC0-1.0",
    # File-level weak copyleft; compatible with linking from MIT code
    # (cssparser/selectors via scraper, colored, option-ext via dirs).
    "MPL-2.0",
]
exceptions = [
    # Allow ring which has a unique license structure
    { allow = ["MIT", "ISC", "OpenSSL"], name = "ring" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # Deny old versions with known issues
    { name = "openssl", version = "<0.10.55" },
    { name = "tokio", version = "<1.20" },
    # Deny packages that could be problematic
    { name = "git2" }, # Use libgit2-sys instead
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/",
    "https://gitlab.com/",
]
